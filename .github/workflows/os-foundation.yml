name: B.I.N.E.S.H. OS Foundation

on:
  push:
    branches:
      - main
      - "architecture/**"
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate OS layout
        run: |
          test -f os/README.md
          test -f os/build/x86_64/build-image.sh
          test -f os/boot/README.md
          test -f os/installer/README.md
          test -f os/system/README.md
          test -f os/config/x86_64/README.md
          test -f os/config/x86_64/qemu-smoke.sh
          test -f os/config/aarch64/README.md
          test -f os/config/aarch64/build-image.sh
          test -f os/installer/INSTALLER_DESIGN.md
          test -f os/installer/validate-target.sh
          test -f runtime/manifest.schema.json
          test -f docs/architecture/OS_ACCEPTANCE.md
          test -f docs/architecture/PROPER_OS_ROADMAP.md

  python:
    name: Existing Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  x86_64-image:
    name: Build x86_64 development ISO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap grub-efi-amd64-bin grub-pc-bin xorriso squashfs-tools mtools qemu-system-x86
      - name: Build image
        run: sudo bash os/build/x86_64/build-image.sh
      - name: Verify artifact
        run: |
          test -s out/x86_64/binesh-os-x86_64-dev.iso
          test -s out/x86_64/binesh-os-x86_64-dev.iso.sha256
          sha256sum -c out/x86_64/binesh-os-x86_64-dev.iso.sha256
          file out/x86_64/binesh-os-x86_64-dev.iso
      - name: QEMU boot smoke test
        run: |
          set -o pipefail
          timeout 90s qemu-system-x86_64 -m 2048 -cdrom out/x86_64/binesh-os-x86_64-dev.iso -serial stdio -display none -no-reboot 2>&1 | tee out/x86_64/qemu-boot.log
          grep -q "B.I.N.E.S.H. OS" out/x86_64/qemu-boot.log
      - name: Upload development ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binesh-os-x86_64-dev
          path: |
            out/x86_64/binesh-os-x86_64-dev.iso
            out/x86_64/binesh-os-x86_64-dev.iso.sha256
