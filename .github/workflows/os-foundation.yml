name: B.I.N.E.S.H. OS Foundation

on:
  push:
    branches: ["main", "architecture/**"]
    paths:
      - "os/**"
      - "runtime/**"
      - "docs/architecture/**"
      - ".github/workflows/os-foundation.yml"
  pull_request:
    paths:
      - "os/**"
      - "runtime/**"
      - "docs/architecture/**"
      - ".github/workflows/os-foundation.yml"

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application manifest schema
        run: python - <<'PY'
import json
from pathlib import Path
p=Path("runtime/manifest.schema.json")
schema=json.loads(p.read_text())
assert schema["$schema"].startswith("https://json-schema.org/")
assert "required" in schema
print("manifest schema: OK")
PY
      - name: Validate required OS architecture
        run: |
          test -f os/README.md
          test -f os/build/README.md
          test -f os/boot/README.md
          test -f os/installer/README.md
          test -f os/system/README.md
          test -f os/config/x86_64/README.md
          test -f os/config/aarch64/README.md
          test -f docs/architecture/OS_ACCEPTANCE.md
          test -f docs/architecture/PROPER_OS_ROADMAP.md
          echo "OS architecture: OK"

  python:
    name: Existing Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
