name: B.I.N.E.S.H. OS Foundation

on:
  push:
    branches:
      - main
      - "architecture/**"
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OS layout
        run: |
          test -f os/README.md
          test -f os/build/x86_64/build-image.sh
          test -f os/boot/README.md
          test -f os/installer/README.md
          test -f os/system/README.md
          test -f os/config/x86_64/README.md
          test -f os/config/x86_64/qemu-smoke.sh
          test -f os/config/aarch64/README.md
          test -f runtime/manifest.schema.json
          test -f docs/architecture/OS_ACCEPTANCE.md
          test -f docs/architecture/PROPER_OS_ROADMAP.md

  python:
    name: Existing Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  x86_64-image:
    name: Build x86_64 development ISO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap grub-efi-amd64-bin grub-pc-bin xorriso squashfs-tools
      - name: Build image
        run: sudo ./os/build/x86_64/build-image.sh
      - name: Verify artifact
        run: |
          test -s out/x86_64/binesh-os-x86_64-dev.iso
          test -s out/x86_64/binesh-os-x86_64-dev.iso.sha256
          sha256sum -c out/x86_64/binesh-os-x86_64-dev.iso.sha256
          file out/x86_64/binesh-os-x86_64-dev.iso
      - name: Upload development ISO
        uses: actions/upload-artifact@v4
        with:
          name: binesh-os-x86_64-dev
          path: |
            out/x86_64/binesh-os-x86_64-dev.iso
            out/x86_64/binesh-os-x86_64-dev.iso.sha256
            