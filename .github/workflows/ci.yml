name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32 firmware
        run: pio run
      - name: Verify firmware artifact
        run: |
          test -s .pio/build/esp32/firmware.bin
          sha256sum .pio/build/esp32/firmware.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: binesh-os-esp32-firmware
          path: .pio/build/esp32/firmware.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binesh-os-esp32-firmware
          path: release
      - name: Generate checksum
        run: sha256sum release/firmware.bin > release/firmware.bin.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/firmware.bin
            release/firmware.bin.sha256
