name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify installed wheel includes all source packages
        run: |
          wheel_dir="$RUNNER_TEMP/binesh-os-wheel"
          venv_dir="$RUNNER_TEMP/binesh-os-wheel-venv"
          mkdir -p "$wheel_dir"
          python -m pip wheel --no-deps . --wheel-dir "$wheel_dir"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --no-deps "$wheel_dir"/*.whl
          cd "$RUNNER_TEMP"
          "$venv_dir/bin/python" -c "from core.event import Event; from runtime.package_detect import detect_package; from runtime.runtime_plan import plan_runtime; from services.attendance.engine import Punch, process_punch"
      - run: python -m pip check
      - run: python -m pytest

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755 # v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Validate PlatformIO source tree
        run: test -f platforms/esp32/src/main.cpp
      - name: Build ESP32 firmware
        run: pio run
      - name: Verify firmware artifact
        run: |
          test -s .pio/build/esp32/firmware.bin
          sha256sum .pio/build/esp32/firmware.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binesh-os-esp32-firmware
          path: .pio/build/esp32/firmware.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binesh-os-esp32-firmware
          path: release
      - name: Generate checksum
        run: sha256sum release/firmware.bin > release/firmware.bin.sha256
      - name: Verify release checksum
        working-directory: release
        run: sha256sum -c firmware.bin.sha256
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/firmware.bin
            release/firmware.bin.sha256
